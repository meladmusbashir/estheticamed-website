name: Einmaliger Import der Website

on:
  push:
    paths:
      - ".github/workflows/import-site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Paket laden und prüfen
        run: |
          curl -fsSL --retry 5 --retry-delay 10 \
            "https://estheticamed.higgsfield.app/_export/30c4e15bb8ec0ccd28565168.tgz" -o /tmp/site.tgz
          echo "517e753199ece265eeeb387ec4e5a334a0e6a1baf858326ba00414f81863d180  /tmp/site.tgz" | sha256sum -c -

      - name: Entpacken
        run: |
          tar -xzf /tmp/site.tgz -C .
          rm -f .github/workflows/import-site.yml
          ls -la

      - name: Ins Repo übernehmen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Website-Code und Bilder importiert"
          git push
